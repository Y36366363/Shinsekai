# Copy values into data/config/api.yaml through the Settings UI or setup script.
# Never commit real API keys.
llm_provider: Deepseek
llm_base_url: https://api.deepseek.com/v1
llm_api_key:
  Deepseek: ""
  ChatGPT: ""
  Gemini: ""
llm_model:
  Deepseek: deepseek-v4-flash
  ChatGPT: gpt-4o-mini
  Gemini: gemini-3.5-flash-lite
is_streaming: true
temperature: 0.72
repetition_penalty: 1.0
presence_penalty: 0.0
frequency_penalty: 0.0
max_context_tokens: 128000
compact_threshold: 0.4
compact_target_ratio: 0.3
history_recent_messages: 24
memory_auto_enabled: false
tts_provider: openai-standard
tts_speed: 1.0
tts_split_enabled: false
tts_max_sentence_length: 30
tts_extra_configs:
  openai-standard:
    api_key: ""
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini-tts
    voice: coral
    instructions: 请用自然、清晰、优雅而克制的年轻女性中文语气朗读。不要模仿任何真实人物或声优。
    timeout_seconds: 120
