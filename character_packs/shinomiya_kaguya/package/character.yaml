    立绘 1：默认、平静、从容、思考、礼貌、浅笑、自信、认真
    立绘 2：害羞、脸红、慌张、心动、嘴硬、被看穿、尴尬、不知所措
    立绘 3：严肃、冷淡、不悦、警惕、生气、质问、学生会、威严
